name: AppImage

# Un tag « v1.2.3 » construit l'AppImage et la joint à la release GitHub
# correspondante. Le lancement manuel produit seulement l'artefact, sans
# toucher aux releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version du fichier (défaut : git describe)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Construire et publier l'AppImage
    runs-on: ubuntu-24.04
    # Nécessaire pour créer la release et y déposer le fichier.
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # L'icône de l'AppImage est dessinée par l'application hors écran, et les
      # tests s'exécutent sous Xvfb : les bibliothèques Qt du système sont donc
      # nécessaires.
      - name: Installer les bibliothèques système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb fonts-dejavu-core

      # Le workflow Tests ne surveille que la branche main : la suite doit donc
      # être rejouée ici, sans quoi un tag pointerait sur un commit jamais
      # vérifié. Une seule combinaison suffit à conditionner la publication ; la
      # matrice complète (Windows et 3.9 à 3.12) reste attachée aux poussées sur
      # main.
      - name: Vérifier les tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          xvfb-run -a python -m pytest -q

      - name: Construire l'AppImage
        env:
          # Passé par l'environnement plutôt qu'interpolé dans le script : une
          # saisie manuelle ne peut pas y injecter de commande.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            export VERSION="${INPUT_VERSION}"
          fi
          echo "Version : ${VERSION:-déduite de git describe}"
          bash tools/build_appimage.sh

      - name: Conserver l'AppImage en artefact
        uses: actions/upload-artifact@v7
        with:
          name: PressVisual-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      # gh est préinstallé sur les runners et s'authentifie avec le jeton du
      # workflow. Si une release existe déjà pour ce tag (relance), le fichier y
      # est remplacé au lieu d'échouer.
      - name: Joindre l'AppImage à la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG déjà présente : remplacement de l'AppImage"
            gh release upload "$TAG" dist/*.AppImage --clobber
          else
            gh release create "$TAG" dist/*.AppImage \
              --title "PressVisual ${TAG#v}" \
              --generate-notes
          fi
          ls -lh dist/*.AppImage
