name: Release

# Un tag « v1.2.3 » construit les binaires Linux, Windows et macOS, puis les
# joint à la release GitHub correspondante. Le lancement manuel ne produit que
# les artefacts, sans toucher aux releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version des fichiers (défaut : git describe)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Le workflow Tests couvre la matrice complète (Windows et Python 3.9 à
  # 3.12) mais ne se déclenche que sur une poussée vers main. Publier un tag
  # posé sur un commit non vérifié, ou sur un commit dont les tests ont échoué,
  # livrerait donc des binaires jamais contrôlés : cette porte exige qu'une
  # exécution verte du workflow Tests existe bien pour le commit exact du tag,
  # et fait échouer la release sinon. Les trois constructions en dépendent, si
  # bien qu'aucun binaire n'est produit quand la CI n'est pas verte.
  tests-verts:
    name: Exiger la CI verte
    runs-on: ubuntu-24.04
    # Lecture des exécutions Actions du dépôt : sans « actions: read », l'API
    # répond 403 et la porte échouerait sur un dépôt pourtant vérifié.
    permissions:
      actions: read
      contents: read

    steps:
      - name: Vérifier le workflow Tests sur le commit publié
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Le commit examiné : celui porté par le tag lors d'une publication,
          # la tête de branche lors d'un lancement manuel.
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Une exécution encore en cours n'est ni verte ni rouge : on lui
          # laisse le temps d'aboutir plutôt que de faire échouer une release
          # taguée dans la minute qui suit la poussée sur main.
          DEADLINE=$((SECONDS + 1800))

          while :; do
            # 2>&1 sous condition : un échec de lecture (jeton sans droit,
            # workflow renommé, panne de l'API) doit être rapporté tel quel,
            # jamais pris pour une absence d'exécution.
            if ! RUNS=$(gh api \
              "repos/${GH_REPO}/actions/workflows/tests.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"' 2>&1); then
              echo "::error::Lecture des exécutions du workflow Tests impossible : ${RUNS}"
              exit 1
            fi

            if [[ -z "$RUNS" ]]; then
              echo "Aucune exécution du workflow Tests pour ${SHA}."
            else
              echo "$RUNS"
              if grep -q "^completed success " <<<"$RUNS"; then
                echo "::notice::Workflow Tests vert pour ${SHA}."
                exit 0
              fi
              # Aucune exécution en attente parmi celles trouvées : elles ont
              # toutes échoué (échec, annulation, délai), attendre n'y changerait
              # rien.
              if ! grep -qE "^(queued|requested|waiting|pending|in_progress) " <<<"$RUNS"; then
                echo "::error::Le workflow Tests n'est pas vert pour ${SHA} : binaires non construits."
                exit 1
              fi
            fi

            if (( SECONDS >= DEADLINE )); then
              echo "::error::Workflow Tests toujours en cours pour ${SHA} après 30 minutes."
              exit 1
            fi
            sleep 30
          done

  # Le nom des binaires vient du tag, le numéro affiché par l'application vient
  # de APP_VERSION (pressvisual_app/constants.py) : sans cette porte, un oubli
  # de mise à jour livrait un fichier « 1.2.3 » qui répond « 1.2.2 ». La tâche
  # n'est jamais sautée — un lancement manuel n'a pas de tag —, c'est l'étape
  # qui l'est : une tâche sautée ferait sauter les trois constructions qui en
  # dépendent.
  version-du-tag:
    name: Vérifier la version du tag
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Comparer le tag à la version affichée
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # stdlib seulement : aucune dépendance à installer avant de savoir
          # si la release a un sens.
          if ! message=$(python3 tools/check_version.py "${TAG}" 2>&1); then
            echo "::error::${message}"
            exit 1
          fi
          echo "::notice::${message}"

  appimage:
    name: AppImage (Linux)
    needs: [tests-verts, version-du-tag]
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # L'icône de l'AppImage est dessinée par l'application hors écran, et les
      # tests s'exécutent sous Xvfb : les bibliothèques Qt du système sont donc
      # nécessaires.
      - name: Installer les bibliothèques système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb fonts-dejavu-core

      # La porte « Exiger la CI verte » interroge la matrice complète ; cette
      # étape rejoue la suite sur l'arbre exact qui va être empaqueté, sous la
      # forme d'un simple contrôle de plus avant la construction.
      - name: Vérifier les tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          xvfb-run -a python -m pytest -q

      - name: Construire l'AppImage
        env:
          # Passé par l'environnement plutôt qu'interpolé dans le script : une
          # saisie manuelle ne peut pas y injecter de commande.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            export VERSION="${INPUT_VERSION}"
          fi
          echo "Version : ${VERSION:-déduite de git describe}"
          # tee : la sortie complète reste lisible dans le journal du workflow,
          # et le fichier est joint au run en cas d'échec (les journaux GitHub
          # ne sont pas accessibles sans authentification).
          set -o pipefail
          bash tools/build_appimage.sh 2>&1 | tee build-appimage.log

      - name: Conserver l'AppImage
        uses: actions/upload-artifact@v7
        with:
          name: PressVisual-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Conserver les journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: PressVisual-AppImage-logs
          path: |
            build-appimage.log
            build/appimage/*.log
          if-no-files-found: ignore

  windows:
    name: Exécutable (Windows)
    needs: [tests-verts, version-du-tag]
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Le script est lancé avec Windows PowerShell 5.1, la version que la
      # documentation demande, et non avec le pwsh par défaut du runner : c'est
      # ainsi qu'il sera exécuté sur une machine utilisateur.
      - name: Construire l'exécutable
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $version = ""
          }

          # Tableau et non table de hachage : le splatting d'une table de
          # hachage ne transmet pas des paramètres nommés à un exécutable natif.
          $arguments = @(
            "-ExecutionPolicy", "Bypass",
            "-File", "tools\build_windows.ps1",
            "-OneFile"
          )
          if ($version) { $arguments += @("-Version", $version) }

          powershell @arguments
          if ($LASTEXITCODE -ne 0) { throw "La construction Windows a échoué." }

      - name: Conserver l'exécutable
        uses: actions/upload-artifact@v7
        with:
          name: PressVisual-Windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: Bundle (macOS)
    needs: [tests-verts, version-du-tag]
    # Runner Apple Silicon : le build PyInstaller cible l'architecture de la
    # machine qui l'exécute, et le nom du fichier le mentionne. Pour un .dmg
    # Intel, ajoutez « macos-26-intel » à une matrice.
    runs-on: macos-26
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Le script s'appuie sur iconutil, codesign et hdiutil, fournis par les
      # outils Xcode déjà présents sur l'image du runner.
      - name: Construire le bundle
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            export VERSION="${INPUT_VERSION}"
          fi
          echo "Version : ${VERSION:-déduite de git describe}"
          set -o pipefail
          bash tools/build_macos.sh 2>&1 | tee build-macos.log

      - name: Conserver l'image disque
        uses: actions/upload-artifact@v7
        with:
          name: PressVisual-macOS
          path: dist/*.dmg
          if-no-files-found: error

      - name: Conserver les journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: PressVisual-macOS-logs
          path: |
            build-macos.log
            build/macos/*.log
          if-no-files-found: ignore

  release:
    name: Publier la release
    needs: [appimage, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Nécessaire pour créer la release et y déposer les fichiers.
    permissions:
      contents: write

    steps:
      # --notes-from-tag lit le message du tag dans le dépôt git local, pas par
      # l'API : sans ce checkout, gh échoue sur « not a git repository ». Les
      # tags annotés ne sont récupérés qu'avec l'historique complet.
      - name: Récupérer le dépôt et ses tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Récupérer les binaires construits
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # gh est préinstallé sur les runners et s'authentifie avec le jeton du
      # workflow. Si une release existe déjà pour ce tag (relance), les fichiers
      # y sont remplacés au lieu d'échouer.
      - name: Créer ou compléter la release
        env:
          GH_TOKEN: ${{ github.token }}
          # Explicite plutôt que déduit du dépôt cloné : la résolution reste
          # juste même si le remote n'est pas celui attendu.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ls -lh dist

          # Le message du tag annoté décrit la version ; --generate-notes ne
          # remplit rien sans pull requests et ne laisse qu'un lien de
          # comparaison. Un tag léger n'a pas de message : gh échouerait, d'où
          # la vérification préalable de son type.
          TAG_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            --jq '.object.type' 2>/dev/null || echo commit)
          if [[ "$TAG_TYPE" == "tag" ]]; then
            NOTES=(--notes-from-tag)
            echo "notes : message du tag annoté"
          else
            NOTES=(--generate-notes)
            echo "tag léger : notes générées"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG déjà présente : remplacement des binaires"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${NOTES[@]}"
          else
            gh release create "$TAG" dist/* \
              --title "PressVisual ${TAG#v}" "${NOTES[@]}"
          fi
