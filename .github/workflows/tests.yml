name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les bibliothèques système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb fonts-dejavu-core

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Vérifier la compilation
        run: python -m compileall -q pressvisual.py pressvisual_app tools

      # Les tests utilisent le greffon Qt « offscreen » : aucune fenêtre ne
      # s'ouvre. Xvfb fournit seulement l'affichage X11 dont pynput a besoin
      # pour s'importer sous Linux.
      - name: Lancer les tests
        run: xvfb-run -a python -m pytest -q
