name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Sortie UTF-8 sur Windows : les messages de test sont en français.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      # Windows est la plateforme principale de PressVisual, macOS livre un
      # .dmg et Python 3.9 est la version minimale annoncée : les trois doivent
      # être vérifiés, pas seulement la combinaison la plus récente sous Linux.
      matrix:
        # Ubuntu 24.04 est épinglé volontairement : « ubuntu-latest » bascule
        # progressivement sur Ubuntu 26.04, pour lequel actions/setup-python ne
        # fournit pas de Python 3.9 précompilé. L'épinglage évite aussi qu'un
        # même commit échoue sur un runner et passe sur l'autre.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        # macOS n'apparaît qu'avec la version qui empaquette le .dmg : cette
        # tâche vérifie le comportement propre à la plateforme (import de
        # pynput par Quartz, dialogues Qt, chemins du dossier de données), pas
        # la compatibilité des versions de Python, déjà couverte deux fois.
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les bibliothèques système de Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb fonts-dejavu-core

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Vérifier la compilation
        run: python -m compileall -q pressvisual.py pressvisual_app tools

      # Les tests utilisent le greffon Qt « offscreen » : aucune fenêtre ne
      # s'ouvre. Xvfb fournit seulement l'affichage X11 dont pynput a besoin
      # pour s'importer sous Linux ; ni Windows ni macOS n'en ont besoin.
      - name: Lancer les tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Lancer les tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q

      # Un échec propre à macOS ne se reproduit sur aucune autre machine, et le
      # journal complet d'une tâche n'est lisible qu'avec un compte GitHub. Une
      # annotation, elle, est publique : les premières lignes d'échec y sont
      # recopiées pour que la panne soit diagnostiquable sans le journal.
      - name: Lancer les tests (macOS)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          status=0
          python -m pytest -q 2>&1 | tee pytest.log || status=$?
          if (( status != 0 )); then
            grep -E "^(FAILED|ERROR)" pytest.log | head -n 8 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
            exit "$status"
          fi

  # Une seule tâche suffit : le style et la couverture ne dépendent ni du
  # système ni de la version de Python, contrairement aux tests eux-mêmes.
  qualite:
    name: Analyse statique et couverture
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les bibliothèques système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb fonts-dejavu-core

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Règles et exclusions définies dans pyproject.toml. Le format « github »
      # affiche chaque remarque en annotation directement sur la ligne fautive.
      - name: Analyse statique (ruff)
        run: python -m ruff check --output-format=github .

      # Le seuil d'échec (85 %) est défini dans pyproject.toml : la tâche tombe
      # en erreur si la couverture descend sous ce plancher.
      - name: Tests avec mesure de couverture
        run: xvfb-run -a python -m pytest -q --cov --cov-report=term-missing
