name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Sortie UTF-8 sur Windows : les messages de test sont en français.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      # Windows est la plateforme principale de PressVisual et Python 3.9 est la
      # version minimale annoncée : les deux doivent être vérifiés, pas seulement
      # la combinaison la plus récente sous Linux.
      matrix:
        # Ubuntu 24.04 est épinglé volontairement : « ubuntu-latest » bascule
        # progressivement sur Ubuntu 26.04, pour lequel actions/setup-python ne
        # fournit pas de Python 3.9 précompilé. L'épinglage évite aussi qu'un
        # même commit échoue sur un runner et passe sur l'autre.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les bibliothèques système de Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb fonts-dejavu-core

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Vérifier la compilation
        run: python -m compileall -q pressvisual.py pressvisual_app tools

      # Les tests utilisent le greffon Qt « offscreen » : aucune fenêtre ne
      # s'ouvre. Xvfb fournit seulement l'affichage X11 dont pynput a besoin
      # pour s'importer sous Linux ; Windows n'en a pas besoin.
      - name: Lancer les tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Lancer les tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
